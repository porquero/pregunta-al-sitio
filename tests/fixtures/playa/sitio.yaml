# Sitio de referencia: Playa SPA. Lo lee `pregunta-al-sitio build`.
# config lo escribe `pregunta-al-sitio calibrar --escribir`.
nombre: Playa SPA
config:
  motor:
    k1: 1.6
    pesos:
      titulo: 2
      preguntas: 1.5
      keywords: 3
      sinonimos: 2
    similitudMin: 0.5
    frase: 0.5
  zonas:
    Ta: 0.5
    Ca: 0.5
    Ma: 0
    Tm: 0.3
    Cm: 0.2
  opcionesMedia: 2
validar:
  respuesta:
    palabras_min: 40
    palabras_max: 60
    nombrar: Playa SPA
    nombrar_salvo:
      - saludo
  preguntas:
    min: 6
    max: 12
  tipos:
    - saludo
    - indice
    - servicio
    - producto
    - caso
    - proceso
    - faq
    - quienes
    - ficha
    - contacto
    - legal
  variantes:
    - servicio
    - producto
    - caso
    - proceso
    - cifras
    - llamado
    - cta
    - contacto
    - ficha
  aristas:
    tipos:
      - prueba
      - proceso
      - profundiza
      - cta
    peso_min: 0.3
    peso_max: 1
  faq_max: 6
  pendiente: "[REDACTAR"
  reglas:
    - patron: ISO\s*27001[^.]{0,80}certificad|certificad[^.]{0,80}ISO\s*27001
      nivel: error
      mensaje: 'ISO 27001 junto a "certificado": se presenta solo como marco de referencia'
    - patron: \bno es\b[^.;]{1,80}\b(sino|es)\b
      campo: respuesta_y_cuerpo
      nivel: aviso
      mensaje: posible contraste "no es X, es Y"
    - patron: huevohost
      nivel: error
      mensaje: menciona Huevohost
    - patron: \b\d+(?:[.,]\d+)?\s*UF\b|\$\s?\d|\bCLP\b
      sensible: true
      nivel: error
      mensaje: "publica un precio o monto: el sitio no muestra precios"
