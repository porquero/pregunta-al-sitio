  # Consultas cortas
  - { consulta: "hosting", ambito: sitio }
  - { consulta: "whatsapp reservas", ambito: sitio }
  - { consulta: "iso 27001", ambito: sitio }
  - { consulta: "fotosíntesis", ambito: neutro }

  # Fuera de la lista de preguntas
  - { consulta: "¿Aceptan alumnos en práctica?", ambito: derivar }
  - { consulta: "Quiero enviar mi currículum", ambito: derivar }
